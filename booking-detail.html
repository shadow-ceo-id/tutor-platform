<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Booking — Ajarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0F2A26; --ink-soft:#2A423D; --paper:#FAF8F2; --paper-alt:#F1ECDE;
    --marigold:#F2A63D; --marigold-deep:#D98A22; --teal:#1F8A76; --muted:#5B6B66;
    --line:#E4DFD1; --white:#FFFFFF; --error:#C0392B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;padding:24px;}
  .wrap{max-width:560px;margin:0 auto;}
  .back-link{font-size:0.86rem;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:16px;}

  .status-badge{
    display:inline-block;font-size:0.78rem;font-weight:700;padding:6px 14px;
    border-radius:999px;margin-bottom:16px;
  }
  .status-menunggu_pembayaran{background:rgba(217,138,34,0.15);color:var(--marigold-deep);}
  .status-dibayar, .status-menunggu_respon_tutor{background:rgba(31,138,118,0.15);color:var(--teal);}
  .status-diterima, .status-berlangsung{background:rgba(31,138,118,0.15);color:var(--teal);}
  .status-selesai{background:rgba(15,42,38,0.1);color:var(--ink);}
  .status-ditolak_tutor, .status-dibatalkan_client{background:rgba(192,57,43,0.12);color:var(--error);}
  .status-disengketakan{background:rgba(192,57,43,0.18);color:var(--error);}

  .card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;}
  .card h2{font-size:0.92rem;margin-bottom:14px;color:var(--muted);text-transform:uppercase;letter-spacing:0.02em;}
  .row{display:flex;justify-content:space-between;padding:8px 0;font-size:0.92rem;border-bottom:1px solid var(--paper-alt);}
  .row:last-child{border-bottom:none;}
  .row .label{color:var(--muted);}
  .row .value{font-weight:600;text-align:right;}

  .pin-box{
    background:var(--paper-alt);border-radius:12px;padding:20px;text-align:center;margin-top:8px;
  }
  .pin-box .pin-num{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;letter-spacing:0.2em;color:var(--teal);}
  .pin-box .pin-label{font-size:0.8rem;color:var(--muted);margin-top:6px;}

  input{
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;
    font-size:1.1rem;text-align:center;letter-spacing:0.3em;background:var(--paper);color:var(--ink);width:100%;
    margin-top:10px;
  }

  .btn{
    background:var(--marigold);color:var(--ink);border:none;
    padding:13px;border-radius:999px;font-weight:700;font-size:0.94rem;cursor:pointer;width:100%;margin-top:10px;
  }
  .btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--muted);}
  .btn-danger{background:transparent;border:1.5px solid var(--error);color:var(--error);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  .msg{font-size:0.86rem;padding:10px 12px;border-radius:8px;margin-top:12px;display:none;}
  .msg.show{display:block;}
  .msg.error{background:rgba(192,57,43,0.1);color:var(--error);}
  .msg.success{background:rgba(31,138,118,0.1);color:var(--teal);}
  .msg.info{background:rgba(217,138,34,0.1);color:var(--marigold-deep);}

  .contact-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
  .contact-row a{color:var(--teal);font-weight:700;text-decoration:none;}

  .star-picker{display:flex;gap:8px;margin-bottom:14px;}
  .star{font-size:1.8rem;cursor:pointer;color:var(--line);transition:color .1s ease;}
  .star.active{color:var(--marigold);}
  textarea{
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;
    font-size:0.9rem;background:var(--paper);color:var(--ink);width:100%;min-height:70px;resize:vertical;
  }
  .review-existing{background:var(--paper-alt);border-radius:12px;padding:16px;}
  .review-stars{color:var(--marigold-deep);font-size:1rem;margin-bottom:6px;}

  .chat-box{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;margin-bottom:12px;padding-right:4px;}
  .chat-msg{max-width:80%;padding:9px 13px;border-radius:14px;font-size:0.86rem;line-height:1.4;}
  .chat-msg.own{background:var(--ink);color:var(--paper);align-self:flex-end;border-bottom-right-radius:3px;}
  .chat-msg.other{background:var(--paper-alt);align-self:flex-start;border-bottom-left-radius:3px;}
  .chat-time{font-size:0.66rem;opacity:0.6;margin-top:3px;}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{
    flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 14px;
    font-family:inherit;font-size:0.86rem;background:var(--paper);color:var(--ink);
  }
  .chat-send-btn{
    background:var(--marigold);border:none;color:var(--ink);border-radius:999px;
    padding:0 18px;font-weight:700;font-size:0.86rem;cursor:pointer;
  }
  .chat-empty{text-align:center;color:var(--muted);font-size:0.82rem;padding:16px 0;}

  .link-danger{color:var(--error);font-size:0.82rem;text-decoration:underline;cursor:pointer;display:inline-block;margin-top:10px;}

  .loading{text-align:center;color:var(--muted);padding:60px 0;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading">Memuat...</div>
</div>

<script>
  const SUPABASE_URL = 'https://yxaqvywhhbsyjqfgtebn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_DMOft_KQMR41TnigUV1Oxw_TVeHd3Bx';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const STATUS_LABEL = {
    menunggu_pembayaran: 'Menunggu Pembayaran',
    dibayar: 'Menunggu Respon Tutor',
    menunggu_respon_tutor: 'Menunggu Respon Tutor',
    diterima: 'Diterima Tutor',
    berlangsung: 'Sesi Berlangsung',
    selesai: 'Selesai',
    ditolak_tutor: 'Ditolak Tutor',
    dibatalkan_client: 'Dibatalkan',
    disengketakan: 'Dalam Peninjauan Admin'
  };

  const params = new URLSearchParams(window.location.search);
  const bookingId = params.get('id');
  let currentUser = null;
  let booking = null;
  let isTutor = false;
  let myReview = null;
  let selectedRating = 0;

  function formatRupiah(n){ return 'Rp' + Number(n).toLocaleString('id-ID'); }
  function formatTanggalJam(slot){
    if(!slot) return '-';
    const d = new Date(slot.tanggal + 'T00:00:00');
    return d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long' }) + ', ' + slot.jam_mulai.slice(0,5) + '–' + slot.jam_selesai.slice(0,5);
  }

  async function init(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){ window.location.href = 'auth.html'; return; }
    currentUser = session.user;

    const { data, error } = await supabaseClient
      .from('bookings')
      .select('*, availability_slots(*), tutor:tutor_id(nama, no_hp), client:client_id(nama, no_hp)')
      .eq('id', bookingId)
      .single();

    if(error || !data){
      document.getElementById('app').innerHTML = '<div class="loading">Booking tidak ditemukan.</div>';
      return;
    }

    booking = data;
    isTutor = currentUser.id === booking.tutor_id;

    if(booking.status === 'selesai'){
      const { data: existingReview } = await supabaseClient
        .from('reviews')
        .select('*')
        .eq('booking_id', booking.id)
        .eq('dari_user_id', currentUser.id)
        .maybeSingle();
      myReview = existingReview || null;
    }

    render();
  }

  function render(){
    const slot = booking.availability_slots;
    const kontakTerbuka = !['menunggu_pembayaran', 'ditolak_tutor', 'dibatalkan_client'].includes(booking.status);
    const lawan = isTutor ? booking.client : booking.tutor;

    document.getElementById('app').innerHTML = `
      <a href="dashboard.html" class="back-link">← Kembali ke Dashboard</a>

      <div class="status-badge status-${booking.status}">${STATUS_LABEL[booking.status] || booking.status}</div>

      <div class="card">
        <h2>Detail Sesi</h2>
        <div class="row"><span class="label">${isTutor ? 'Murid' : 'Tutor'}</span><span class="value">${isTutor ? booking.client?.nama : booking.tutor?.nama}</span></div>
        <div class="row"><span class="label">Kategori</span><span class="value">${booking.kategori || '-'}</span></div>
        <div class="row"><span class="label">Jadwal</span><span class="value">${formatTanggalJam(slot)}</span></div>
        <div class="row"><span class="label">Harga</span><span class="value">${formatRupiah(booking.harga_disepakati)}</span></div>
        ${booking.lokasi ? `<div class="row"><span class="label">Alamat</span><span class="value">${booking.lokasi}</span></div>` : ''}
        ${booking.catatan_client ? `<div class="row"><span class="label">Catatan</span><span class="value">${booking.catatan_client}</span></div>` : ''}
      </div>

      ${kontakTerbuka ? `
        <div class="card">
          <h2>Kontak ${isTutor ? 'Murid' : 'Tutor'}</h2>
          <p style="font-size:0.82rem;color:var(--muted);margin-bottom:6px;">
            Pembayaran sudah aman di Ajarin. Nomor ini untuk koordinasi teknis sesi ini saja (alamat, jam datang, dll) — booking berikutnya tetap wajib lewat Ajarin.
          </p>
          <div class="contact-row">
            <span>${lawan?.nama || '-'}</span>
            <a href="https://wa.me/62${(lawan?.no_hp || '').replace(/^0/, '')}" target="_blank">${lawan?.no_hp || '-'} →</a>
          </div>
        </div>
      ` : ''}

      ${['diterima','berlangsung','selesai'].includes(booking.status) ? `
        <div class="card">
          <h2>Chat</h2>
          <div class="chat-box" id="chatBox"><div class="chat-empty">Memuat chat...</div></div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Tulis pesan...">
            <button class="chat-send-btn" id="chatSendBtn">Kirim</button>
          </div>
          ${!['selesai'].includes(booking.status) ? `<span class="link-danger" id="disputeBtn">⚠️ Laporkan Masalah</span>` : ''}
        </div>
      ` : ''}

      <div id="actionArea"></div>
    `;

    renderActions();
    if(['diterima','berlangsung','selesai'].includes(booking.status)){
      initChat();
      const disputeBtn = document.getElementById('disputeBtn');
      if(disputeBtn) disputeBtn.addEventListener('click', handleDispute);
    }
  }

  function renderActions(){
    const area = document.getElementById('actionArea');

    // ---- CLIENT: belum bayar ----
    if(!isTutor && booking.status === 'menunggu_pembayaran'){
      area.innerHTML = `
        <div class="card">
          <h2>Pembayaran</h2>
          <p style="font-size:0.86rem;color:var(--muted);margin-bottom:10px;">
            Dana kamu akan ditahan aman oleh Ajarin sampai sesi selesai dikonfirmasi kedua pihak.
          </p>
          <div class="msg show info">⚠️ Payment gateway (Midtrans/Xendit) belum terhubung — ini masih simulasi manual untuk testing alur. Jangan gunakan uang asli dulu.</div>
          <button class="btn" id="payBtn">Bayar ${formatRupiah(booking.harga_disepakati)} (Simulasi)</button>
          <button class="btn btn-outline" id="cancelBtn">Batalkan</button>
        </div>
      `;
      document.getElementById('payBtn').addEventListener('click', simulatePayment);
      document.getElementById('cancelBtn').addEventListener('click', () => handleCancel(100));
      return;
    }

    // ---- TUTOR: perlu terima/tolak ----
    if(isTutor && (booking.status === 'dibayar' || booking.status === 'menunggu_respon_tutor')){
      area.innerHTML = `
        <div class="card">
          <h2>Konfirmasi Booking</h2>
          <p style="font-size:0.86rem;color:var(--muted);margin-bottom:10px;">
            Ada permintaan booking baru. Terima kalau kamu bisa mengajar di jadwal ini.
          </p>
          <button class="btn" id="acceptBtn">Terima Booking</button>
          <button class="btn btn-danger" id="rejectBtn">Tolak</button>
          <div class="msg" id="actionMsg"></div>
        </div>
      `;
      document.getElementById('acceptBtn').addEventListener('click', () => updateBookingStatus('diterima'));
      document.getElementById('rejectBtn').addEventListener('click', () => updateBookingStatus('ditolak_tutor'));
      return;
    }

    // ---- CLIENT: sudah bayar, menunggu respon tutor -> masih bisa batal, full refund ----
    if(!isTutor && (booking.status === 'dibayar' || booking.status === 'menunggu_respon_tutor')){
      area.innerHTML = `
        <div class="card">
          <h2>Menunggu Tutor</h2>
          <p style="font-size:0.86rem;color:var(--muted);margin-bottom:10px;">
            Tutor belum merespon. Kamu masih bisa membatalkan dengan refund penuh.
          </p>
          <button class="btn btn-outline" id="cancelBtn">Batalkan (Refund 100%)</button>
          <div class="msg" id="cancelMsg"></div>
        </div>
      `;
      document.getElementById('cancelBtn').addEventListener('click', () => handleCancel(100));
      return;
    }

    // ---- Diterima: tampilkan PIN & tombol konfirmasi selesai ----
    if(booking.status === 'diterima' || booking.status === 'berlangsung'){
      const jamSisa = getJamSisaKeSesi();
      const refundInfo = jamSisa >= 24 ? '100% (masih >24 jam)' : jamSisa >= 2 ? '50% (2–24 jam sebelum jadwal)' : '0% (kurang dari 2 jam)';

      area.innerHTML = `
        <div class="card">
          <h2>${!isTutor ? 'PIN Konfirmasi Sesi' : 'Selesaikan Sesi'}</h2>
          ${!isTutor ? `
            <p style="font-size:0.86rem;color:var(--muted);margin-bottom:10px;">
              Kasih kode ini ke tutor SETELAH sesi belajar selesai, biar dana bisa dilepas.
            </p>
            <div class="pin-box">
              <div class="pin-num">${booking.pin_konfirmasi}</div>
              <div class="pin-label">Kode Konfirmasi</div>
            </div>
          ` : `
            <p style="font-size:0.86rem;color:var(--muted);margin-bottom:10px;">
              Minta kode 4 digit dari murid setelah sesi selesai, lalu masukkan di sini.
            </p>
            <input type="text" id="pinInput" maxlength="4" placeholder="0000" inputmode="numeric">
            <button class="btn" id="confirmPinBtn">Konfirmasi Sesi Selesai</button>
            <div class="msg" id="pinMsg"></div>
          `}
        </div>
        ${!isTutor ? `
          <div class="card">
            <h2>Batalkan Booking</h2>
            <p style="font-size:0.82rem;color:var(--muted);margin-bottom:10px;">
              Estimasi refund saat ini: <strong>${refundInfo}</strong> sesuai kebijakan pembatalan.
            </p>
            <button class="btn btn-danger" id="cancelBtn">Batalkan Booking</button>
            <div class="msg" id="cancelMsg"></div>
          </div>
        ` : ''}
      `;
      if(isTutor){
        document.getElementById('confirmPinBtn').addEventListener('click', confirmPin);
      }else{
        document.getElementById('cancelBtn').addEventListener('click', () => handleCancel(null));
      }
      return;
    }

    // ---- Disengketakan ----
    if(booking.status === 'disengketakan'){
      area.innerHTML = `
        <div class="card">
          <h2>Sedang Ditinjau Admin</h2>
          <p style="font-size:0.86rem;color:var(--muted);">
            Laporan kamu sedang ditinjau oleh admin Ajarin. Dana tetap aman ditahan sampai keputusan diambil. Kamu bisa lanjut chat di atas untuk kasih info tambahan.
          </p>
        </div>
      `;
      return;
    }

    // ---- Ditolak / Dibatalkan ----
    if(booking.status === 'ditolak_tutor' || booking.status === 'dibatalkan_client'){
      area.innerHTML = `
        <div class="card">
          <h2>${booking.status === 'ditolak_tutor' ? 'Booking Ditolak Tutor' : 'Booking Dibatalkan'}</h2>
          <p style="font-size:0.86rem;color:var(--muted);">
            ${!isTutor ? 'Cek saldo kamu di halaman Profil — dana yang bisa dikembalikan sudah otomatis masuk ke sana.' : 'Slot jadwal ini sudah kosong lagi dan bisa dibooking ulang.'}
          </p>
        </div>
      `;
      return;
    }

    // ---- Selesai ----
    if(booking.status === 'selesai'){
      if(myReview){
        area.innerHTML = `
          <div class="card">
            <h2>Review Kamu</h2>
            <div class="review-existing">
              <div class="review-stars">${'★'.repeat(myReview.rating)}${'☆'.repeat(5 - myReview.rating)}</div>
              <div style="font-size:0.88rem;color:var(--ink-soft);">${myReview.komentar || '(tanpa komentar)'}</div>
              ${myReview.status === 'menunggu_moderasi' ? '<div style="font-size:0.76rem;color:var(--muted);margin-top:8px;">Sedang ditinjau admin</div>' : ''}
            </div>
          </div>
        `;
      }else{
        area.innerHTML = `
          <div class="card">
            <h2>Beri Review ${isTutor ? 'untuk Murid' : 'untuk Tutor'}</h2>
            <div class="star-picker" id="starPicker">
              ${[1,2,3,4,5].map(n => `<span class="star" data-n="${n}">★</span>`).join('')}
            </div>
            <textarea id="komentar" placeholder="Ceritain pengalaman sesi kamu..."></textarea>
            <div class="msg" id="reviewMsg"></div>
            <button class="btn" id="submitReviewBtn" disabled>Pilih Rating Dulu</button>
          </div>
        `;

        document.querySelectorAll('.star').forEach(star => {
          star.addEventListener('click', () => {
            selectedRating = parseInt(star.dataset.n);
            document.querySelectorAll('.star').forEach(s => {
              s.classList.toggle('active', parseInt(s.dataset.n) <= selectedRating);
            });
            const btn = document.getElementById('submitReviewBtn');
            btn.disabled = false;
            btn.textContent = 'Kirim Review';
          });
        });

        document.getElementById('submitReviewBtn').addEventListener('click', submitReview);
      }
    }
  }

  async function submitReview(){
    if(selectedRating === 0) return;
    const btn = document.getElementById('submitReviewBtn');
    const msgEl = document.getElementById('reviewMsg');
    btn.disabled = true; btn.textContent = 'Mengirim...';

    const keUserId = isTutor ? booking.client_id : booking.tutor_id;

    const { error } = await supabaseClient.from('reviews').insert({
      booking_id: booking.id,
      dari_user_id: currentUser.id,
      ke_user_id: keUserId,
      rating: selectedRating,
      komentar: document.getElementById('komentar').value.trim()
    });

    if(error){
      msgEl.textContent = 'Gagal kirim review: ' + error.message;
      msgEl.className = 'msg show error';
      btn.disabled = false; btn.textContent = 'Kirim Review';
      return;
    }

    myReview = { rating: selectedRating, komentar: document.getElementById('komentar').value.trim(), status: selectedRating >= 3 ? 'disetujui' : 'menunggu_moderasi' };
    renderActions();
  }

  function getJamSisaKeSesi(){
    const slot = booking.availability_slots;
    if(!slot) return 999;
    const jamSesi = new Date(slot.tanggal + 'T' + slot.jam_mulai);
    return (jamSesi - new Date()) / (1000 * 60 * 60);
  }

  async function handleCancel(){
    if(!confirm('Yakin mau batalkan booking ini? Refund akan diproses sesuai kebijakan pembatalan.')) return;

    const btn = document.getElementById('cancelBtn');
    const msgEl = document.getElementById('cancelMsg');
    btn.disabled = true; btn.textContent = 'Memproses...';

    const { error } = await supabaseClient
      .from('bookings')
      .update({ status: 'dibatalkan_client' })
      .eq('id', booking.id);

    if(error){
      msgEl.textContent = 'Gagal membatalkan: ' + error.message;
      msgEl.className = 'msg show error';
      btn.disabled = false; btn.textContent = 'Batalkan Booking';
      return;
    }

    booking.status = 'dibatalkan_client';
    render();
  }

  async function initChat(){
    const { data: messages } = await supabaseClient
      .from('chat_messages')
      .select('*')
      .eq('booking_id', booking.id)
      .order('created_at', { ascending: true });

    renderChat(messages || []);

    document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
    document.getElementById('chatInput').addEventListener('keypress', (e) => {
      if(e.key === 'Enter') sendChatMessage();
    });

    // Realtime: pesan baru langsung muncul tanpa refresh
    supabaseClient
      .channel('chat-' + booking.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: 'booking_id=eq.' + booking.id }, (payload) => {
        appendChatMessage(payload.new);
      })
      .subscribe();
  }

  function renderChat(messages){
    const chatBox = document.getElementById('chatBox');
    if(messages.length === 0){
      chatBox.innerHTML = '<div class="chat-empty">Belum ada pesan. Mulai chat untuk koordinasi sesi.</div>';
      return;
    }
    chatBox.innerHTML = messages.map(m => chatBubbleHtml(m)).join('');
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function chatBubbleHtml(m){
    const isOwn = m.sender_id === currentUser.id;
    const time = new Date(m.created_at).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
    return `<div class="chat-msg ${isOwn ? 'own' : 'other'}">${m.pesan}<div class="chat-time">${time}</div></div>`;
  }

  function appendChatMessage(m){
    const chatBox = document.getElementById('chatBox');
    if(!chatBox) return;
    if(chatBox.querySelector('.chat-empty')) chatBox.innerHTML = '';
    chatBox.insertAdjacentHTML('beforeend', chatBubbleHtml(m));
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function sendChatMessage(){
    const input = document.getElementById('chatInput');
    const pesan = input.value.trim();
    if(!pesan) return;
    input.value = '';

    await supabaseClient.from('chat_messages').insert({
      booking_id: booking.id,
      sender_id: currentUser.id,
      pesan
    });
  }

  async function handleDispute(){
    if(!confirm('Laporkan masalah pada booking ini? Admin akan meninjau dan menghubungi kamu.')) return;

    await supabaseClient.from('bookings').update({ status: 'disengketakan' }).eq('id', booking.id);
    booking.status = 'disengketakan';
    render();
  }

  async function simulatePayment(){
    const btn = document.getElementById('payBtn');
    btn.disabled = true; btn.textContent = 'Memproses...';

    // Catatan: di production, ini harus lewat backend (Vercel function) yang
    // memanggil Midtrans/Xendit, verifikasi callback, BARU update status di sini.
    // Ini simulasi langsung dari client HANYA untuk testing alur booking-lock.
    const { error } = await supabaseClient
      .from('bookings')
      .update({ status: 'dibayar' })
      .eq('id', booking.id);

    if(error){
      alert('Gagal update status: ' + error.message);
      btn.disabled = false; btn.textContent = 'Bayar (Simulasi)';
      return;
    }

    booking.status = 'dibayar';
    render();
  }

  async function updateBookingStatus(newStatus){
    const { error } = await supabaseClient
      .from('bookings')
      .update({ status: newStatus })
      .eq('id', booking.id);

    if(error){
      document.getElementById('actionMsg').textContent = 'Gagal: ' + error.message;
      document.getElementById('actionMsg').className = 'msg show error';
      return;
    }

    // Kalau ditolak, kembalikan slot jadi kosong lagi
    if(newStatus === 'ditolak_tutor' && booking.slot_id){
      await supabaseClient.from('availability_slots').update({ status: 'kosong' }).eq('id', booking.slot_id);
    }

    booking.status = newStatus;
    render();
  }

  async function confirmPin(){
    const input = document.getElementById('pinInput');
    const msgEl = document.getElementById('pinMsg');
    const btn = document.getElementById('confirmPinBtn');

    if(input.value.trim() !== booking.pin_konfirmasi){
      msgEl.textContent = 'PIN salah. Coba tanya lagi ke murid.';
      msgEl.className = 'msg show error';
      return;
    }

    btn.disabled = true; btn.textContent = 'Memproses...';

    const { error } = await supabaseClient
      .from('bookings')
      .update({
        status: 'selesai',
        dikonfirmasi_tutor_at: new Date().toISOString(),
        dikonfirmasi_client_at: new Date().toISOString()
      })
      .eq('id', booking.id);

    if(error){
      msgEl.textContent = 'Gagal konfirmasi: ' + error.message;
      msgEl.className = 'msg show error';
      btn.disabled = false; btn.textContent = 'Konfirmasi Sesi Selesai';
      return;
    }

    booking.status = 'selesai';
    render();
  }

  init();
</script>

</body>
</html>
