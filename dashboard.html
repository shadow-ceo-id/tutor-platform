<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Ajarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0F2A26; --ink-soft:#2A423D; --paper:#FAF8F2; --paper-alt:#F1ECDE;
    --marigold:#F2A63D; --marigold-deep:#D98A22; --teal:#1F8A76; --muted:#5B6B66;
    --line:#E4DFD1; --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;padding:24px;}
  .wrap{max-width:640px;margin:0 auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
  .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.3rem;}
  .logo span{color:var(--marigold-deep);}
  .logout{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:0.82rem;color:var(--muted);cursor:pointer;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .notif-link{
    position:relative;background:var(--white);border:1px solid var(--line);border-radius:50%;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:1.1rem;
  }
  .notif-dot{
    position:absolute;top:-2px;right:-2px;background:#E24C3B;color:#fff;
    min-width:18px;height:18px;border-radius:999px;font-size:0.62rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);
  }

  .greeting{margin-bottom:24px;}
  .greeting h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;margin-bottom:4px;}
  .greeting p{color:var(--muted);font-size:0.92rem;}

  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .menu-card{
    background:var(--white);border:1px solid var(--line);border-radius:16px;
    padding:22px 18px;text-decoration:none;color:var(--ink);transition:transform .15s ease;
  }
  .menu-card:hover{transform:translateY(-3px);}
  .menu-card .icon{font-size:1.6rem;margin-bottom:10px;}
  .menu-card .title{font-weight:700;font-size:0.94rem;margin-bottom:4px;}
  .menu-card .desc{font-size:0.8rem;color:var(--muted);}

  .loading{text-align:center;color:var(--muted);padding:60px 0;}
  .admin-badge{background:var(--ink);color:var(--paper);}
  .admin-badge .icon{color:var(--marigold);}

  /* ===== CHAT WIDGET ===== */
  .chat-fab{
    position:fixed;bottom:22px;right:22px;z-index:60;
    width:56px;height:56px;border-radius:50%;
    background:var(--marigold);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 28px -8px rgba(217,138,34,0.6);
    border:none;cursor:pointer;
  }
  .chat-fab svg{width:24px;height:24px;}
  .chat-overlay{
    position:fixed;inset:0;background:rgba(15,42,38,0.4);
    display:none;align-items:flex-end;justify-content:flex-end;padding:0;z-index:100;
  }
  .chat-overlay.open{display:flex;}
  @media(min-width:640px){.chat-overlay{padding:24px;}}
  .chat-panel{
    background:var(--white);width:100%;max-width:420px;height:100%;
    display:flex;flex-direction:column;border-radius:0;box-shadow:0 30px 80px -20px rgba(15,42,38,0.5);
  }
  @media(min-width:640px){.chat-panel{height:min(640px,90vh);border-radius:20px;overflow:hidden;}}
  .chat-header{background:var(--ink);color:var(--paper);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .chat-header-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;}
  .chat-header-sub{font-size:0.78rem;color:rgba(250,248,242,0.65);margin-top:2px;}
  .chat-close{background:rgba(250,248,242,0.14);border:none;color:var(--paper);cursor:pointer;padding:9px;border-radius:50%;display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex-shrink:0;}
  .chat-close svg{width:20px;height:20px;}
  .chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--paper);overscroll-behavior:contain;}
  .msg-bubble{max-width:82%;padding:11px 15px;border-radius:16px;font-size:0.92rem;line-height:1.45;}
  .msg-bot{background:var(--white);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg-user{background:var(--ink);color:var(--paper);align-self:flex-end;border-bottom-right-radius:4px;}
  .msg-typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;}
  .msg-typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:0.5;animation:blink 1.2s infinite;}
  .msg-typing span:nth-child(2){animation-delay:0.2s;}
  .msg-typing span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.3;}40%{opacity:1;}}
  .chat-input-row{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--white);flex-shrink:0;}
  .chat-input-row input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-family:inherit;font-size:0.92rem;background:var(--paper);color:var(--ink);}
  .chat-send{background:var(--marigold);border:none;color:var(--ink);width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .chat-send svg{width:18px;height:18px;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading">Memuat...</div>
</div>

<script>
  const SUPABASE_URL = 'https://yxaqvywhhbsyjqfgtebn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_DMOft_KQMR41TnigUV1Oxw_TVeHd3Bx';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function init(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){
      window.location.href = 'auth.html';
      return;
    }

    const { data: userProfile } = await supabaseClient
      .from('users')
      .select('nama, roles, email')
      .eq('id', session.user.id)
      .single();

    chatUserContext = { email: userProfile?.email || session.user.email, nama: userProfile?.nama };

    const { count: unreadCount } = await supabaseClient
      .from('notifications')
      .select('id', { count: 'exact', head: true })
      .eq('user_id', session.user.id)
      .eq('is_read', false);

    const isTutor = userProfile?.roles?.includes('tutor');
    const isAdmin = userProfile?.roles?.includes('admin');

    document.getElementById('app').innerHTML = `
      <div class="topbar">
        <div class="logo">Ajarin<span>.</span></div>
        <div class="topbar-right">
          <a href="notifikasi.html" class="notif-link">
            🔔
            ${unreadCount > 0 ? `<span class="notif-dot">${unreadCount > 9 ? '9+' : unreadCount}</span>` : ''}
          </a>
          <button class="logout" id="logoutBtn">Keluar</button>
        </div>
      </div>

      <div class="greeting">
        <h1>Halo, ${userProfile?.nama || 'Kak'} 👋</h1>
        <p>${isTutor ? 'Kelola profil dan jadwal mengajar kamu di sini.' : 'Mau cari tutor apa hari ini?'}</p>
      </div>

      <div class="menu-grid">
        ${isTutor ? `
          <a href="profil-tutor.html" class="menu-card">
            <div class="icon">👤</div>
            <div class="title">Profil Tutor</div>
            <div class="desc">Edit bio, harga, kategori</div>
          </a>
          <a href="jadwal-tutor.html" class="menu-card">
            <div class="icon">📅</div>
            <div class="title">Jadwal Saya</div>
            <div class="desc">Atur slot mengajar</div>
          </a>
          <a href="kebutuhan-tutor.html" class="menu-card">
            <div class="icon">📢</div>
            <div class="title">Kebutuhan Tutor</div>
            <div class="desc">Kirim penawaran ke calon murid</div>
          </a>
        ` : `
          <a href="cari-tutor.html" class="menu-card">
            <div class="icon">🔍</div>
            <div class="title">Cari Tutor</div>
            <div class="desc">Temukan tutor terverifikasi</div>
          </a>
          <a href="post-kebutuhan.html" class="menu-card">
            <div class="icon">📢</div>
            <div class="title">Posting Kebutuhan</div>
            <div class="desc">Biar tutor yang kirim penawaran</div>
          </a>
          <a href="profil-tutor.html" class="menu-card">
            <div class="icon">🎓</div>
            <div class="title">Jadi Tutor</div>
            <div class="desc">Mulai mengajar di Ajarin</div>
          </a>
        `}
        <a href="pesanan.html" class="menu-card">
          <div class="icon">📋</div>
          <div class="title">Pesanan Saya</div>
          <div class="desc">Lihat semua booking</div>
        </a>
        ${isAdmin ? `
          <a href="admin.html" class="menu-card admin-badge">
            <div class="icon">🛡️</div>
            <div class="title">Panel Admin</div>
            <div class="desc" style="color:rgba(250,248,242,0.65);">Kelola dispute & review</div>
          </a>
        ` : ''}
      </div>

      <!-- Chat widget -->
      <button class="chat-fab" id="chatFab" aria-label="Chat dengan Ajarin" onclick="openChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 01-8.5 8.5c-1.35 0-2.6-.32-3.7-.9L3 21l1.9-5.7A8.4 8.4 0 013.5 11.5 8.5 8.5 0 0112 3a8.5 8.5 0 019 8.5z"/></svg>
      </button>

      <div id="chatOverlay" class="chat-overlay" onclick="if(event.target===this)closeChat()">
        <div class="chat-panel">
          <div class="chat-header">
            <div>
              <div class="chat-header-title">Ajarin</div>
              <div class="chat-header-sub">Biasanya balas dalam hitungan detik</div>
            </div>
            <button class="chat-close" onclick="closeChat()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="chat-body" id="chatBody"></div>
          <form class="chat-input-row" id="chatForm">
            <input type="text" id="chatInput" placeholder="Tulis pesan..." autocomplete="off" required>
            <button type="submit" class="chat-send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </form>
        </div>
      </div>
    `;

    setupChatWidget();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'auth.html';
    });
  }

  // ===== CHAT WIDGET =====
  const CHAT_API = '/api/chat';
  let chatHistory = [];
  let chatOpened = false;
  let chatUserContext = null; // diisi dari init() setelah tau siapa yang login

  function openChat(){
    document.getElementById('chatOverlay').classList.add('open');
    if(!chatOpened){
      chatOpened = true;
      addBotMessage('Halo Kak! 👋 Ada yang bisa dibantu seputar Ajarin?');
    }
  }
  function closeChat(){
    document.getElementById('chatOverlay').classList.remove('open');
  }
  function scrollChatToBottom(){
    const body = document.getElementById('chatBody');
    if(body) body.scrollTop = body.scrollHeight;
  }
  function addBotMessage(text){
    const body = document.getElementById('chatBody');
    const el = document.createElement('div');
    el.className = 'msg-bubble msg-bot';
    el.textContent = text;
    body.appendChild(el);
    scrollChatToBottom();
  }
  function addUserMessage(text){
    const body = document.getElementById('chatBody');
    const el = document.createElement('div');
    el.className = 'msg-bubble msg-user';
    el.textContent = text;
    body.appendChild(el);
    scrollChatToBottom();
  }
  function showTyping(){
    const body = document.getElementById('chatBody');
    const el = document.createElement('div');
    el.className = 'msg-typing';
    el.id = 'typingIndicator';
    el.innerHTML = '<span></span><span></span><span></span>';
    body.appendChild(el);
    scrollChatToBottom();
  }
  function hideTyping(){
    const el = document.getElementById('typingIndicator');
    if(el) el.remove();
  }

  function setupChatWidget(){
    const form = document.getElementById('chatForm');
    if(!form) return;

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if(!text) return;

      addUserMessage(text);
      chatHistory.push({ role: 'user', content: text });
      input.value = '';
      showTyping();

      try{
        const res = await fetch(CHAT_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory, context: chatUserContext })
        });
        const data = await res.json();
        hideTyping();

        if(!res.ok || !data.reply){
          addBotMessage('Maaf, lagi ada gangguan. Coba lagi sebentar ya.');
          return;
        }

        chatHistory.push({ role: 'assistant', content: data.reply });
        const cleanText = data.reply.replace(/<!--[\s\S]*?-->/g, '').trim();
        addBotMessage(cleanText);
      }catch(err){
        hideTyping();
        addBotMessage('Maaf, koneksi lagi bermasalah. Coba lagi sebentar ya.');
      }
    });
  }

  init();
</script>

</body>
</html>
