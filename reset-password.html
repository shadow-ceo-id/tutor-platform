<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Ajarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0F2A26; --ink-soft:#2A423D; --paper:#FAF8F2; --paper-alt:#F1ECDE;
    --marigold:#F2A63D; --marigold-deep:#D98A22; --teal:#1F8A76; --muted:#5B6B66;
    --line:#E4DFD1; --white:#FFFFFF; --error:#C0392B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    background:var(--white);border:1px solid var(--line);border-radius:20px;
    padding:36px 32px;max-width:420px;width:100%;
    box-shadow:0 30px 60px -30px rgba(15,42,38,0.28);
  }
  .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.5rem;text-align:center;margin-bottom:6px;}
  .logo span{color:var(--marigold-deep);}
  .subtitle{text-align:center;color:var(--muted);font-size:0.9rem;margin-bottom:28px;}
  label{font-size:0.84rem;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;margin-top:14px;}
  input{
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;
    font-size:0.94rem;background:var(--paper);color:var(--ink);width:100%;
  }
  .btn{
    margin-top:20px;background:var(--marigold);color:var(--ink);border:none;
    padding:13px;border-radius:999px;font-weight:700;font-size:0.96rem;cursor:pointer;width:100%;
  }
  .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .msg{font-size:0.86rem;padding:10px 12px;border-radius:8px;margin-top:14px;display:none;}
  .msg.show{display:block;}
  .msg.error{background:rgba(192,57,43,0.1);color:var(--error);}
  .msg.success{background:rgba(31,138,118,0.1);color:var(--teal);}
</style>
</head>
<body>

<div class="card">
  <div class="logo">Ajarin<span>.</span></div>
  <div class="subtitle">Buat password baru</div>

  <form id="resetForm">
    <label>Password Baru</label>
    <input type="password" id="newPassword" required minlength="6" placeholder="Minimal 6 karakter">
    <label>Ulangi Password Baru</label>
    <input type="password" id="confirmPassword" required minlength="6" placeholder="Ulangi password">
    <div class="msg" id="resetMsg"></div>
    <button type="submit" class="btn" id="resetBtn">Simpan Password Baru</button>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://yxaqvywhhbsyjqfgtebn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_DMOft_KQMR41TnigUV1Oxw_TVeHd3Bx';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('resetBtn');
    const msgEl = document.getElementById('resetMsg');

    const pass1 = document.getElementById('newPassword').value;
    const pass2 = document.getElementById('confirmPassword').value;

    if(pass1 !== pass2){
      msgEl.textContent = 'Password tidak sama, coba cek lagi.';
      msgEl.className = 'msg show error';
      return;
    }

    btn.disabled = true; btn.textContent = 'Menyimpan...';

    const { error } = await supabaseClient.auth.updateUser({ password: pass1 });

    if(error){
      msgEl.textContent = 'Gagal reset password: ' + error.message;
      msgEl.className = 'msg show error';
      btn.disabled = false; btn.textContent = 'Simpan Password Baru';
      return;
    }

    msgEl.textContent = 'Password berhasil diubah! Mengalihkan ke halaman login...';
    msgEl.className = 'msg show success';
    setTimeout(() => { window.location.href = 'auth.html'; }, 2000);
  });
</script>

</body>
</html>
